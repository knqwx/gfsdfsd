<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>1000 rooms</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        .level-label {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 18px;
            z-index: 10;
        }

        .game-btn {
            background-color: #ffffff;
            border: 1px solid #000000;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            position: absolute;
            display: none;
        }

        .game-btn:hover {
            background-color: #f0f0f0;
        }

        /* Кнопка в заблокированном состоянии */
        .game-btn.used {
            cursor: default;
            background-color: #e0e0e0;
            color: #7f7f7f;
        }

        /* Прыжок по комнатам в 1 комнате */
        .room-jump-container {
            position: absolute;
            top: 100px;
            left: 20px;
            display: flex;
            gap: 5px;
        }

        .room-jump-container input {
            padding: 5px;
            width: 60px;
            border: 1px solid #000;
        }

        /* Сетка для 5 уровня */
        .grid-container {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            grid-template-columns: repeat(2, 100px);
            grid-gap: 15px;
        }

        .square {
            width: 100px;
            height: 100px;
            background-color: #ffffff;
            border: 1px solid #000000;
            cursor: pointer;
        }

        .square:hover {
            background-color: #f0f0f0;
        }

        /* Ввод текста (Ур. 7) */
        .input-container {
            display: none;
            position: absolute;
            top: 70%;
            left: 20px;
        }

        .input-container input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #000;
            outline: none;
        }

        /* Кастомное модальное окно (Ур. 8) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.3);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background-color: #ffffff;
            border: 1px solid #000000;
            padding: 20px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

        .modal-buttons {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .modal-buttons button {
            background-color: #ffffff;
            border: 1px solid #000000;
            padding: 5px 15px;
            cursor: pointer;
        }

        /* Комната 9: Капча в левом верхнем углу */
        .captcha-container {
            display: none;
            position: absolute;
            top: 20px;
            left: 20px;
            border: 1px solid #000;
            padding: 10px;
            background: #fff;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            z-index: 20;
        }

        .captcha-btn {
            background: #fff;
            border: 1px solid #000;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .captcha-btn:hover {
            background: #f0f0f0;
        }

        /* Комната 10: Вопрос Hello! */
        .question-container {
            display: none;
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 20px;
        }

        .question-buttons {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .question-buttons button {
            background: #fff;
            border: 1px solid #000;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Шестеренка в 11 уровне */
        .gear-btn {
            display: none;
            position: absolute;
            bottom: 30px;
            left: 30px;
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="level-label" id="levelDisplay">level: 1</div>

    <!-- Уровень 1: Кнопка START и Прыжок по комнатам -->
    <button class="game-btn" id="startBtn" style="display: block; top: 50px; left: 20px;" onclick="startAction()">start</button>
    <div class="room-jump-container" id="roomJumpContainer">
        <input type="number" id="roomJumpInput" min="1" max="1000" placeholder="Room">
        <button class="game-btn" id="goBtn" style="display:inline-block; position:static;" onclick="jumpToRoom()">Go</button>
    </div>

    <!-- Уровень 2, 3, 4: Кнопка END (фиксированная позиция) -->
    <button class="game-btn" id="endBtn" style="top: 150px; left: 150px;" onclick="endAction()">end</button>

    <!-- Уровень 3, 4: Кнопка HERE (фиксированная позиция) -->
    <button class="game-btn" id="hereBtn" style="top: 200px; left: 150px;" onclick="hereAction()">here</button>

    <!-- Уровень 5: 4 квадрата -->
    <div class="grid-container" id="gridContainer">
        <div class="square" id="sq0" onclick="checkSquare(0)"></div>
        <div class="square" id="sq1" onclick="checkSquare(1)"></div>
        <div class="square" id="sq2" onclick="checkSquare(2)"></div>
        <div class="square" id="sq3" onclick="checkSquare(3)"></div>
    </div>

    <!-- Уровень 6: Кнопка ADD TEXT -->
    <button class="game-btn" id="addTextBtn" style="top: 20px; right: 100px;" onclick="addTextAction()">add text</button>

    <!-- Уровень 7: Поле ввода текста -->
    <div class="input-container" id="inputContainer">
        <input type="text" id="textInput" placeholder="Type and press Enter..." onkeydown="handleInputKey(event)">
    </div>

    <!-- Уровень 8: Кнопка Мусорки (фиксированная позиция) -->
    <button class="game-btn" id="trashBtn" style="top: 250px; left: 150px;" onclick="openTrashModal()">🗑️</button>

    <!-- Кастомное модальное окно (Уровень 8) -->
    <div class="modal-overlay" id="trashModal">
        <div class="modal-box">
            <p>are u sure u want to remove!</p>
            <div class="modal-buttons">
                <button onclick="resolveTrash('yes')">Yes</button>
                <button onclick="resolveTrash('maybe')">Maybe</button>
                <button onclick="resolveTrash('no')">No</button>
            </div>
        </div>
    </div>

    <!-- Уровень 9: Are you a robot? в левом верхнем углу -->
    <div class="captcha-container" id="captchaContainer">
        <span>Are you a robot?</span>
        <button class="captcha-btn" onclick="clickRobotCheck()">✔️</button>
        <button class="captcha-btn" onclick="clickRobotCross()">❌</button>
    </div>

    <!-- Уровень 10: Вопрос Hello! -->
    <div class="question-container" id="questionContainer">
        <p>Hello!</p>
        <div class="question-buttons">
            <button onclick="answerHello('hi')">Hi</button>
            <button onclick="answerHello('what')">What</button>
        </div>
    </div>

    <!-- Уровень 11: Шестеренка -->
    <button class="gear-btn" id="gearBtn" onclick="alert('Gear clicked! Room 11 reached.')">⚙️</button>

    <script>
        let currentLevel = 1;
        let actionClicks = 0;
        let correctSquareIndex = 0;
        let startUsed = false;
        let endUsed = false;
        let hereUsed = false;
        let trashUsed = false;
        let captchaPassed = false;

        function updateLevel() {
            document.getElementById('levelDisplay').innerText = 'level: ' + currentLevel;
        }

        function jumpToRoom() {
            const val = parseInt(document.getElementById('roomJumpInput').value);
            if (!isNaN(val) && val >= 1 && val <= 1000) {
                goToRoom(val);
            } else {
                alert('Enter a valid room number from 1 to 1000');
            }
        }

        function goToRoom(targetLevel) {
            currentLevel = targetLevel;
            updateLevel();

            if (targetLevel >= 2) document.getElementById('startBtn').style.display = 'block';
            if (targetLevel >= 2) document.getElementById('endBtn').style.display = 'block';
            if (targetLevel >= 3) document.getElementById('hereBtn').style.display = 'block';
            if (targetLevel >= 5) document.getElementById('gridContainer').style.display = 'grid';
            if (targetLevel >= 6) document.getElementById('addTextBtn').style.display = 'block';
            if (targetLevel >= 7) document.getElementById('inputContainer').style.display = 'block';
            if (targetLevel >= 8) document.getElementById('trashBtn').style.display = 'block';
            if (targetLevel >= 9) document.getElementById('captchaContainer').style.display = 'flex';
            if (targetLevel >= 10) document.getElementById('questionContainer').style.display = 'block';
            if (targetLevel >= 11) document.getElementById('gearBtn').style.display = 'block';
        }

        // --- УРОВЕНЬ 1 -> 2 ---
        function startAction() {
            if (startUsed) return; // Не функционирует после первого нажатия
            startUsed = true;
            const btn = document.getElementById('startBtn');
            btn.classList.add('used');
            
            goToRoom(2);
        }

        // --- КЛИКИ ПО END (Ур. 2) ---
        function endAction() {
            if (endUsed) return;
            if (currentLevel === 2) {
                endUsed = true;
                document.getElementById('endBtn').classList.add('used');
                goToRoom(3);
                actionClicks = 0;
            }
        }

        // --- КЛИКИ ПО HERE (Ур. 3 и 4) ---
        function hereAction() {
            if (hereUsed) return;
            actionClicks++;
            if (currentLevel === 3 && actionClicks >= 2) {
                goToRoom(4);
                actionClicks = 0;
            } else if (currentLevel === 4 && actionClicks >= 3) {
                hereUsed = true;
                document.getElementById('hereBtn').classList.add('used');
                goToRoom(5);
                document.getElementById('gridContainer').style.display = 'grid';
                startLevelFive();
            }
        }

        // --- УРОВЕНЬ 5 (Квадраты) ---
        function startLevelFive() {
            correctSquareIndex = Math.floor(Math.random() * 4);
        }

        function checkSquare(index) {
            if (index === correctSquareIndex) {
                document.getElementById('sq' + index).style.backgroundColor = '#00ff00';
                setTimeout(() => {
                    goToRoom(6);
                }, 500);
            } else {
                alert('Wrong! Game over. Restarting...');
                resetGame();
            }
        }

        // --- УРОВЕНЬ 6 (Add Text) ---
        function addTextAction() {
            if (currentLevel === 6) {
                goToRoom(7);
            }
        }

        // --- УРОВЕНЬ 7 (Ввод текста) ---
        function handleInputKey(event) {
            if (event.key === 'Enter') {
                goToRoom(8);
            }
        }

        // --- УРОВЕНЬ 8 (Мусорка) ---
        function openTrashModal() {
            if (trashUsed) return;
            if (currentLevel >= 8) {
                document.getElementById('trashModal').style.display = 'flex';
            }
        }

        function resolveTrash(choice) {
            document.getElementById('trashModal').style.display = 'none';
            trashUsed = true;
            document.getElementById('trashBtn').classList.add('used');
            const addTextBtn = document.getElementById('addTextBtn');

            if (choice === 'yes') {
                addTextBtn.style.display = 'none';
            } else if (choice === 'maybe') {
                addTextBtn.style.display = 'block';
                addTextBtn.style.opacity = '0.5';
            } else if (choice === 'no') {
                addTextBtn.style.display = 'block';
                addTextBtn.style.opacity = '1';
            }
            
            goToRoom(9);
            document.getElementById('captchaContainer').style.display = 'flex';
        }

        // --- УРОВЕНЬ 9 (Капча кнопки) ---
        function clickRobotCheck() {
            // Нажал галочку — значит робот, сброс игры
            alert('You clicked the checkmark! You are a robot. Game over.');
            resetGame();
        }

        function clickRobotCross() {
            if (captchaPassed) return;
            captchaPassed = true;
            // Нажал крестик — прошел дальше в 10 комнату
            goToRoom(10);
            document.getElementById('captchaContainer').style.display = 'none';
            document.getElementById('questionContainer').style.display = 'block';
        }

        // --- УРОВЕНЬ 10 (Вопрос Hello!) ---
        function answerHello(ans) {
            if (ans === 'hi') {
                goToRoom(11);
                document.getElementById('questionContainer').style.display = 'none';
                document.getElementById('gearBtn').style.display = 'block';
            } else {
                alert('Wrong choice! Game over.');
                resetGame();
            }
        }

        // --- СБРОС ИГРЫ ---
        function resetGame() {
            currentLevel = 1;
            actionClicks = 0;
            startUsed = false;
            endUsed = false;
            hereUsed = false;
            trashUsed = false;
            captchaPassed = false;
            updateLevel();
            
            document.getElementById('gridContainer').style.display = 'none';
            document.getElementById('endBtn').style.display = 'none';
            document.getElementById('endBtn').classList.remove('used');
            
            document.getElementById('hereBtn').style.display = 'none';
            document.getElementById('hereBtn').classList.remove('used');
            
            document.getElementById('addTextBtn').style.display = 'none';
            document.getElementById('addTextBtn').style.opacity = '1';
            
            document.getElementById('inputContainer').style.display = 'none';
            
            document.getElementById('trashBtn').style.display = 'none';
            document.getElementById('trashBtn').classList.remove('used');
            
            document.getElementById('trashModal').style.display = 'none';
            document.getElementById('captchaContainer').style.display = 'none';
            document.getElementById('questionContainer').style.display = 'none';
            document.getElementById('gearBtn').style.display = 'none';
            document.getElementById('roomJumpInput').value = '';

            for(let i=0; i<4; i++) {
                document.getElementById('sq' + i).style.backgroundColor = '#ffffff';
            }

            const startBtn = document.getElementById('startBtn');
            startBtn.style.display = 'block';
            startBtn.classList.remove('used');
            startBtn.style.top = '50px';
            startBtn.style.left = '20px';
        }
    </script>

</body>
</html>
