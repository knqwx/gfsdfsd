<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>1000 rooms</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            height: 100vh;
            position: relative;
            box-sizing: border-box;
        }

        /* Надпись level в углу */
        .level-label {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 18px;
        }

        /* Название сайта */
        h1 {
            font-size: 24px;
            font-weight: normal;
            margin-top: 0;
        }

        /* Кнопка START */
        .start-btn {
            background-color: #ffffff;
            border: 1px solid #000000;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        .start-btn:hover {
            background-color: #f0f0f0;
        }

        /* Кнопка END, которая появляется в другом месте */
        .end-btn {
            position: absolute;
            bottom: 50px;
            right: 100px;
            background-color: #ffffff;
            border: 1px solid #000000;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            display: none; /* Скрыта по умолчанию */
        }

        .end-btn:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <div class="level-label" id="levelDisplay">level: 0</div>

    <h1 id="roomTitle">1000 rooms</h1>

    <button class="start-btn" id="startBtn" onclick="nextLevel()">start</button>

    <button class="end-btn" id="endBtn" onclick="nextRoom()">end</button>

    <script>
        let currentLevel = 0;
        let currentRoom = 1;

        function nextLevel() {
            currentLevel = 1;
            document.getElementById('levelDisplay').innerText = 'level: ' + currentLevel;
            
            // Скрываем кнопку старт и показываем кнопку end в другом месте
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('endBtn').style.display = 'block';
        }

        function nextRoom() {
            currentRoom = 2;
            currentLevel = 2;
            
            document.getElementById('roomTitle').innerText = 'Комната ' + currentRoom;
            document.getElementById('levelDisplay').innerText = 'level: ' + currentLevel;
            
            // Скрываем кнопку end после нажатия
            document.getElementById('endBtn').style.display = 'none';
        }
    </script>

</body>
</html>
