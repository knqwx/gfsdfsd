<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>1000 rooms xX_BEST_GAME_Xx</title>
    <style>
        body {
            /* Вырвиглазный кислотный фон */
            background-color: #00FF00;
            /* Самый уродливый стандартный шрифт из возможных */
            font-family: "Comic Sans MS", Impact, Papyrus, sans-serif;
            margin: 0;
            padding: 0;
            /* Нелепый курсор */
            cursor: help;
            overflow: hidden;
            height: 100vh;
        }

        /* Надпись LEVEL в случайном верхнем углу (но не совсем в углу, чтобы бесить) */
        .level-label {
            position: absolute;
            top: 42px;
            right: 137px;
            color: magenta;
            font-size: 45px;
            font-weight: 900;
            transform: rotate(-15deg);
            border: 5px dashed yellow;
            background-color: black;
            padding: 10px;
            z-index: 999;
            text-shadow: 3px 3px 0px red;
        }

        /* Заголовок сайта — кривой и неуместный */
        .site-title {
            color: blue;
            font-size: 70px;
            text-align: left;
            margin-left: 200px;
            margin-top: 100px;
            text-decoration: line-through overline underline;
            letter-spacing: -5px;
        }

        /* Контейнер для кнопки сделан через костыли */
        .button-container {
            position: relative;
            margin-top: 50px;
            margin-left: 350px;
        }

        /* Самая уродливая кнопка START */
        .start-btn {
            background: linear-gradient(to bottom, #ff0000 0%, #0000ff 100%);
            color: yellow;
            font-size: 80px;
            font-family: "Times New Roman", Times, serif;
            font-style: italic;
            border: 10px dotted orange;
            padding: 50px 100px;
            cursor: pointer;
            box-shadow: 20px 20px 0px black;
            transform: rotate(5deg);
        }

        .start-btn:active {
            transform: scale(0.5) rotate(45deg);
            background: pink;
        }

        /* Случайный мусорный текст для завершения картины */
        .footer-trash {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: cyan;
            color: red;
            font-size: 12px;
            text-align: center;
            border-top: 7px solid purple;
        }
    </style>
</head>
<body>

    <!-- Надпись level в углу -->
    <div class="level-label">level: -999</div>

    <!-- Название сайта -->
    <div class="site-title">1000 rooms</div>

    <!-- Кнопка Start -->
    <div class="button-container">
        <button class="start-btn" onclick="alert('НИЧЕГО НЕ РАБОТАЕТ HA-HA-HA')">START</button>
    </div>

    <div class="footer-trash">
        <marquee scrollamount="25">САЙТ СДЕЛАЛ ЛУЧШИЙ ДИЗАЙНЕР В МИРЕ ПЛИЗ НЕ СУДИТЕ СТРОГО КАЧАЙТЕ ВИРУСЫ БЕСПЛАТНО</marquee>
    </div>

</body>
</html>
