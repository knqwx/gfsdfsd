    <meta charset="UTF-8">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --error: #ef4444;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-light);
            font-size: 1rem;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        /* Меню */
        .continent-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-weight: 500;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-all {
            grid-column: span 2;
            background: #10b981;
        }
        .btn-all:hover {
            background: #059669;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: var(--text);
            margin-top: 15px;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        /* Игровая зона */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .flag-container {
            font-size: 6rem;
            margin-bottom: 20px;
            background: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            border: 2px dashed #e5e7eb;
            display: inline-block;
            line-height: 1;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 10px;
        }

        .option-btn {
            background: white;
            border: 2px solid #e5e7eb;
            padding: 15px;
            font-size: 1.05rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
            font-weight: 500;
            word-break: break-word;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f5f3ff;
        }

        .option-btn.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }

        .option-btn.wrong {
            background: var(--error) !important;
            color: white !important;
            border-color: var(--error) !important;
        }

        .results-screen h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .results-screen p {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: var(--text-light);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
